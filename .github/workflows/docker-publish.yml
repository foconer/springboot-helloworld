name: Docker Publish

on:
  workflow_run:
    workflows:
      - Spring Boot Build and Test
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-publish:
    # Only publish if build succeeded
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            foconer/springboot-helloworld:latest
            foconer/springboot-helloworld:${{ github.event.workflow_run.head_sha }}